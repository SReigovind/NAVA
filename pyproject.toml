[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nava-core"
version = "0.2.0"
description = "NAVA reimplementation — clean architecture, premium UI"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["nava_core*"]
